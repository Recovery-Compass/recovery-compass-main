name: bun-lockfile-sync

# Re-armed 2026-08-11. This guard existed and was retired to a jobs:{} stub;
# the 2025-10-21 dependency commit then desynced bun.lock silently and every
# Cloudflare bun-lane build failed frozen-lockfile from that day forward.
# This job mirrors the exact Cloudflare Workers Builds install step so the
# class fails fast in CI, before any deploy lane sees it.

on:
  pull_request:
    paths: ['package.json', 'bun.lock', '.tool-versions']
  push:
    branches: [main]
    paths: ['package.json', 'bun.lock', '.tool-versions']

permissions:
  contents: read

concurrency:
  group: bun-lockfile-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frozen-install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup bun (version from .tool-versions)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions
      - name: Frozen install must pass (mirrors Cloudflare Workers Builds)
        run: bun install --frozen-lockfile
